[project]
name = "laivelup"
version = "0.1.0"
description = "CLI d'évaluation AIDD · LAIVEL UP · Décodeuse way (cadrage, confiance, red flags)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.20", "rich", "jsonschema>=4.20"]
license = {text = "MIT"}

[project.scripts]
laivelup = "laivelup.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "pytest-snapshot>=0.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laivelup = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (allow in CLI)
    "ARG", # flake8-unused-arguments
    "PTH", # pathlib
    "ERA", # eradicate
    "RUF", # ruff-specific
]
[tool.ruff.lint.per-file-ignores]
"src/laivelup/cli.py" = ["T201", "T203", "B008", "B904", "ARG001", "ARG002", "E501", "SIM108", "F401", "E741", "RUF059"]
"src/laivelup/report.py" = ["E501", "C408"]
"src/laivelup/schema.py" = ["B904", "E501"]
"src/laivelup/scoring.py" = ["E501", "RUF005", "RUF015"]
"src/laivelup/model.py" = ["E741"]
"src/laivelup/team.py" = ["F401", "PTH123", "B007", "E501", "W292", "RUF059"]
"src/laivelup/__init__.py" = ["F401", "RUF059"]
"scripts/*.py" = ["T201", "T203", "F401", "ARG001", "B007", "SIM108", "E501"]
"tests/test_interactive.py" = ["T201", "T203", "ARG005", "E501"]
"tests/test_cli.py" = ["T201", "E501"]
"tests/test_cli_extended.py" = ["ARG005", "E501"]
"tests/test_load.py" = ["T201", "F401", "I001", "E501"]
"tests/test_demo.py" = ["F401", "E501"]
"tests/test_encoding.py" = ["F401"]
"tests/test_install_clean.py" = ["F401"]
"tests/test_report.py" = ["F401", "C408"]
"tests/test_scoring.py" = ["C408", "E501"]
"tests/test_scoring_defaults.py" = ["F401", "I001"]
"tests/test_scoring_edge.py" = ["I001", "RUF059"]
"tests/test_schema_extended.py" = ["F401", "I001"]
"tests/test_team.py" = ["F401", "RUF015", "W292"]
"tests/test_snapshots.py" = ["ARG005", "W292"]
"tests/test_properties.py" = ["F401", "I001", "ARG002", "W292"]
"tests/test_calibrate.py" = ["F401", "I001"]
"tests/test_calibrate_degraded.py" = ["I001", "ARG002"]
"tests/test_apply_calibration_fix.py" = ["ARG002", "E501"]
"tests/fixtures/*" = ["I001", "F401"]
"tests/security/*" = ["E501", "F401"]
"docs/*" = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "typer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers --strict-config --cov=src/laivelup --cov-fail-under=85 --cov-branch"
markers = [
    "slow: marks tests as slow",
    "install: marks tests that test installation",
    "security: marks security tests",
    "snapshot: marks snapshot tests",
    "property: marks property-based tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/laivelup"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[[tool.coverage.overrides]]
module = "laivelup.scoring"
fail_under = 100

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.pip-audit]
desc = "on"
skip = []