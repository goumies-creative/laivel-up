repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy src/
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset + security)
        entry: pytest -q -x --no-cov --ignore=tests/fixtures/ --ignore=tests/test_calibrate.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
