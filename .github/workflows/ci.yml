name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff + mypy
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Mypy check
        run: mypy src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml
      - name: pip-audit dependency scan
        run: pip-audit --skip-editable
      - name: Install project
        run: pip install -e .
      - name: Security tests
        run: pytest tests/security/ -v

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install via pip
        run: pip install .
      - name: Verify CLI available
        run: laivelup --version
      - name: Verify help works
        run: laivelup --help
      - name: Verify evaluate help
        run: laivelup evaluate --help
      - name: Verify team help
        run: laivelup team --help

  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Check expected.json exists
        id: check
        run: |
          if [ -f "grille/profils-officiels/expected.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice expected.json non trouvé — calibration sautée (disponible après 28/08 12h)"
          fi
      - name: Run calibration
        if: steps.check.outputs.exists == 'true'
        run: python scripts/calibrate.py --expected grille/profils-officiels/expected.json