name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff + mypy
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Mypy check
        run: mypy src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q --tb=short
      # ADR-0009 : le moteur de scoring est tenu à 100 % (statements + branches).
      # Passe distincte : un run pytest n'a qu'un seul `source` de coverage, donc
      # deux seuils sur deux périmètres différents exigent deux runs. `-o addopts=""`
      # neutralise les addopts partagés (--cov=src/laivelup --cov=scripts
      # --cov-fail-under=85) qui écraseraient le périmètre et le seuil du gate.
      # Forme module obligatoire : `--cov=src/laivelup/scoring.py` ne collecte rien
      # et rapporte 0 % au lieu d'une erreur d'usage visible.
      - name: Engine coverage gate (laivelup.scoring 100%)
        run: pytest -q -o addopts="" --cov=laivelup.scoring --cov-branch --cov-fail-under=100 --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml
      # Audite le lockfile, pas l'environnement : un exit non nul = gate rouge.
      - name: pip-audit dependency scan
        run: pip-audit -r requirements.lock --progress-spinner off
      - name: Install project
        run: pip install -e .[dev]
      - name: Security tests
        run: pytest tests/security/ -v

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install via pip
        run: pip install .
      - name: Verify CLI available
        run: laivelup --version
      - name: Verify help works
        run: laivelup --help
      - name: Verify evaluate help
        run: laivelup evaluate --help
      - name: Verify team help
        run: laivelup team --help

  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Check expected.json exists
        id: check
        run: |
          if [ -f "grille/profils-officiels/expected.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice expected.json non trouvé — calibration sautée (disponible après 28/08 12h)"
          fi
      - name: Run calibration
        if: steps.check.outputs.exists == 'true'
        run: python scripts/calibrate.py --expected grille/profils-officiels/expected.json

  calibrate-degraded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Check expected.json exists
        id: check
        run: |
          if [ -f "grille/profils-officiels/expected.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice expected.json non trouvé — diagnostic dégradé sauté"
          fi
      - name: Run degraded diagnostic
        if: steps.check.outputs.exists == 'true'
        run: python scripts/calibrate_degraded.py --official-dir grille/profils-officiels/ --expected grille/profils-officiels/expected.json --output diagnostic.json --format table
      - name: Upload diagnostic
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calibration-diagnostic
          path: diagnostic.json
